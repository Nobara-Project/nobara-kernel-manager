name: Nobara Kernel Manager RPM Build (Fedora 44 - x86_64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: fedora:44

    steps:
    - uses: actions/checkout@v4

    - name: Install build tools
      run: dnf install -y cargo desktop-file-utils gtk4-devel libadwaita-devel make rpm-build

    - name: Create source archive
      run: |
        mkdir -p SOURCES
        tar --exclude=.git --exclude=target --exclude=SOURCES \
          --transform='s,^,nobara-kernel-manager-0.1.1/,' \
          -czf SOURCES/nobara-kernel-manager-0.1.1.tar.gz .

    - name: Build RPM
      run: |
        rpmbuild -bb spec/nobara-kernel-manager.spec \
          --define "_rpmdir $(pwd)/packages" \
          --define "_sourcedir $(pwd)/SOURCES"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: nobara-kernel-manager-rpm
        path: packages/**/*.rpm
